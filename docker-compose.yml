services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ozon
      POSTGRES_PASSWORD: ozon
      POSTGRES_DB: ozon_prices
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozon -d ozon_prices"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Only needed if you run the parser locally (no PARSER_SERVICE_URL set).
  # If parsing is delegated to a separate machine (see docker-compose.parser.yml),
  # this isn't started by default - bring it up explicitly with:
  #   docker compose --profile local-parser up
  selenium:
    image: selenium/standalone-chrome:latest
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "4444:4444"
    profiles:
      - local-parser

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ozon:ozon@postgres:5432/ozon_prices
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
